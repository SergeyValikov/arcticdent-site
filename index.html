<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="preload"
      as="image"
      href="/images/services/mobile/orthopedia-mobile.png"
      media="(hover: none) and (pointer: coarse)"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      ;(function () {
        var root = document.documentElement
        var stableViewportWidth = null

        try {
          if (localStorage.getItem('accessibleMode') === 'true') {
            root.classList.add('accessible-mode')
          }
        } catch (error) {
          root.classList.remove('accessible-mode')
        }

        function setMobileViewportState() {
          var viewport = document.querySelector('meta[name="viewport"]')
          if (viewport) {
            viewport.setAttribute('content', 'width=device-width, initial-scale=1.0')
          }

          var hasCoarsePointer = window.matchMedia
            ? window.matchMedia('(pointer: coarse)').matches
            : false
          var isApplePhone = /iPhone|iPod/i.test(navigator.userAgent || '')
          var isTouch = hasCoarsePointer
            || navigator.maxTouchPoints > 0
            || 'ontouchstart' in window
            || isApplePhone
          var screenWidth = Math.min(screen.width || 9999, screen.height || 9999)
          var layoutViewport = window.innerWidth || root.clientWidth || screenWidth
          var visualViewportWidth = window.visualViewport && window.visualViewport.width
            ? window.visualViewport.width
            : layoutViewport
          var outerViewportWidth = window.outerWidth || layoutViewport
          var isPinchZoom = window.visualViewport && window.visualViewport.scale && window.visualViewport.scale > 1.01
          var viewportWidth = Math.min(
            screenWidth,
            layoutViewport,
            visualViewportWidth,
            outerViewportWidth,
          )

          if (isPinchZoom && stableViewportWidth) {
            viewportWidth = stableViewportWidth
          } else {
            stableViewportWidth = viewportWidth
          }

          root.style.setProperty('--real-vw', Math.round(viewportWidth) + 'px')
          root.classList.toggle('real-mobile', isTouch && viewportWidth <= 560)
        }

        setMobileViewportState()
        window.addEventListener('resize', setMobileViewportState, { passive: true })
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', setMobileViewportState, { passive: true })
        }
      })()
    </script>
    <title>arcticdent-site</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
